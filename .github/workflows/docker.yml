name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # ./datatoolkit-data is deliberately NOT pre-created: the daemon creates it
      # as root and the engine entrypoint must chown it to uid 1000.
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for _ in $(seq 1 60); do
            engine=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q engine)" 2>/dev/null || echo none)
            web=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q web)" 2>/dev/null || echo none)
            echo "engine: $engine, web: $web"
            if [ "$engine" = healthy ] && [ "$web" = healthy ] && curl -fsS -o /dev/null http://127.0.0.1:8080/; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Studio serves index.html
        run: |
          curl -fsS http://127.0.0.1:8080/ | tee index.out | grep -q 'datatoolkit Studio'
      - name: SPA fallback on a deep route
        run: |
          curl -fsS http://127.0.0.1:8080/some/deep/route | grep -q 'datatoolkit Studio'
      - name: Key list through nginx
        run: curl -fsS http://127.0.0.1:8080/api/keys | grep -q dataset_overview
      - name: Upload ~3 MB CSV through nginx
        run: |
          python3 -c "
          import random
          random.seed(0)
          print('id,x,y,label')
          for i in range(120000):
              print(f'{i},{random.random():.6f},{random.random():.6f},{random.choice(\"abc\")}')
          " > smoke.csv
          ls -l smoke.csv
          [ "$(stat -c %s smoke.csv)" -gt 3000000 ]
          curl -fsS -X PUT --data-binary @smoke.csv http://127.0.0.1:8080/api/uploads/smoke.csv | tee upload.json
      - name: Run dataset_overview on the upload
        run: |
          path=$(python3 -c "import json; print(json.load(open('upload.json'))['path'])")
          code=$(curl -sS -o run.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d "{\"params\": {\"source\": {\"kind\": \"csv\", \"path\": \"$path\"}}}" \
            http://127.0.0.1:8080/api/keys/dataset_overview/run)
          head -c 500 run.json; echo
          [ "$code" = 200 ]
      - name: Upload lands on the host with uid 1000
        run: |
          f=$(ls datatoolkit-data/uploads/*/smoke.csv)
          stat -c '%u %n' "$f"
          [ "$(stat -c %u "$f")" = 1000 ]
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  launcher:
    # The one-command launchers (scripts/datatoolkit.{sh,ps1}) against the
    # published `latest` images, with this branch's compose.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DTK_NO_OPEN: "1"
      DTK_COMPOSE_SRC: ${{ github.workspace }}/compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck datatoolkit.sh
        run: |
          if command -v shellcheck >/dev/null; then shellcheck scripts/datatoolkit.sh; else echo "shellcheck not available"; fi
      - name: Parse-check datatoolkit.ps1 (PowerShell 5.1 syntax)
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/datatoolkit.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            $settings = @{ Rules = @{ PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @('5.1', '7.0') } } }
            $r = Invoke-ScriptAnalyzer -Path scripts/datatoolkit.ps1 -IncludeRule PSUseCompatibleSyntax -Settings $settings
            $r
            if ($r) { exit 1 }
          } else { 'PSScriptAnalyzer not available' }
      - name: sh launcher - start
        run: sh scripts/datatoolkit.sh
      - name: sh launcher - start again through a pipe (idempotent)
        run: sh -s < scripts/datatoolkit.sh
      - name: Studio and /api/keys through nginx
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q 'datatoolkit Studio'
          curl -fsS http://127.0.0.1:8080/api/keys | grep -q dataset_overview
          cat ~/datatoolkit/.env
          test -d ~/datatoolkit/datatoolkit-data
      - name: sh launcher - stop
        run: |
          sh scripts/datatoolkit.sh stop
          if curl -fsS -o /dev/null http://127.0.0.1:8080/; then echo 'still answering after stop'; exit 1; fi
          [ -z "$(docker compose -p datatoolkit ps -q)" ]
      - name: sh launcher - uninstall keeps the data
        run: |
          sh scripts/datatoolkit.sh uninstall
          test -d ~/datatoolkit/datatoolkit-data
          test ! -e ~/datatoolkit/compose.yml
          [ -z "$(docker compose -p datatoolkit ps -aq)" ]
      - name: sh launcher - custom port, then uninstall --purge
        env:
          DTK_PORT: "8090"
        run: |
          sh scripts/datatoolkit.sh
          curl -fsS http://127.0.0.1:8090/api/keys | grep -q dataset_overview
          sh scripts/datatoolkit.sh uninstall --purge
          test ! -e ~/datatoolkit
      - name: ps1 launcher (pwsh) - start, stop, uninstall -Purge
        shell: pwsh
        run: |
          ./scripts/datatoolkit.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/keys).Content -match 'dataset_overview')) { exit 1 }
          ./scripts/datatoolkit.ps1 stop
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/datatoolkit.ps1 uninstall -Purge
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path ~/datatoolkit) { exit 1 }
      - name: Logs on failure
        if: failure()
        run: docker compose -p datatoolkit -f ~/datatoolkit/compose.yml logs || true
      - name: Tear down
        if: always()
        run: docker compose -p datatoolkit -f compose.yml down -v || true

  image:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/matleniz/datatoolkit-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
