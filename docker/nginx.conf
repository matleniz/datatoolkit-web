# Access log as the image's default `main` format, with the agent bridge token
# masked: EventSource sends it as `?token=` (datatoolkit-issues#148).
map $request $dtk_request {
    "~^(?<dtk_pre>.*[?&]token=)[^&\s]*(?<dtk_post>.*)$" "${dtk_pre}***${dtk_post}";
    default $request;
}
log_format dtk_main '$remote_addr - $remote_user [$time_local] "$dtk_request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log dtk_main;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Uploads are raw `PUT /api/uploads/{filename}` bodies: no size cap.
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://engine:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Stream large upload bodies to the engine instead of buffering them on disk.
        proxy_request_buffering off;
    }

    # Agent bridge events (SSE): pass each frame on as it comes, keep the
    # stream open between the engine's pings.
    location = /api/ui/events {
        proxy_pass http://engine:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Not exposed: the agent terminal (no agent CLI in the engine image) and the
    # engine's MCP endpoint (for local MCP clients, not for the browser).
    location ^~ /api/ui/terminal {
        return 404;
    }
    location = /mcp {
        return 404;
    }
    location ^~ /mcp/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
